<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="estilos.css">
  <title>SMNOVA - Contacto</title>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Logo SMNova" height="60">
        </a>
      </div>
      <div class="nav-derecha">
        <button class="hamburguesa" id="btn-menu" onclick="menuMovil()">☰</button>
        <ul class="menu" id="menu">
          <li><a href="perfil-usuario.html">Perfil de muestra</a></li>
          <li><a href="torneos.html">Torneos</a></li>
          <li><a href="como-funciona.html">Manual</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
        <a href="login.html" class="btn-login">Iniciar sesión</a>
      </div>
    </nav>
  </header>

  <main>

    <!-- form de contacto -->
    <section class="login">
      <div class="tarjetalogin">
        <h2>Contáctenos</h2>

        <form>

          <div class="espacio">
            <label for="tema">Tema</label>
            <select id="tema">
              <option value="">Consulta general</option>
              <option value="tecnico">Problema técnico</option>
              <option value="cuenta">Problema de acceso</option>
              <option value="organizador">Quiero organizar un torneo</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="espacio">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Tu nombre">
          </div>

          <div class="espacio">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tu@email.com">
          </div>

          <div class="espacio">
            <label for="mensaje">Mensaje</label>
            <input type="text" id="mensaje" placeholder="¿En qué te podemos ayudar?">
          </div>

          <button type="submit" class="btn-ingresar">Enviar</button>

        </form>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-logo">SMNOVA</div>
    <div class="footer-links">
      <a href="contacto.html">Contacto</a>
      <a href="como-funciona.html">Manual</a>
      <span>Instituto Tecnológico Superior Arias-Balparda</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
