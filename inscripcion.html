<head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

            <title> SMNova - Inscripción</title>
</head>
<body>

  <header>
    <nav class="navbar">
            <div class="logo">
            <a href="index.html">
            <img src="logo.png" alt="Logo SMNova" height="60">
            </a>
            </div>
            <div class="nav-derecha">
              <button class="hamburguesa" id="btn-menu" onclick="menuMovil()">☰</button>
            <ul class="menu" id="menu">
              <li><a href="perfil-usuario.html">Perfil de muestra</a></li>
              <li><a href="torneos.html">Torneos</a></li>
              <li><a href="como-funciona.html">Manual</a></li>
              <li><a href="contacto.html">Contacto</a></li>
            </ul>
           <a href="login.html" class="btn-login">Iniciar sesión</a>
            </div>

</nav>

<main>
<section class="login">
  <div class="tarjetalogin tarjeta-inscripcion">
    <h2>Inscribirme al torneo</h2>
    <p class="subtitulo">Copa Apertura · Ajedrez</p>

    <form>

      <!-- Decide si es inscripción individual o de equipo.
           como el sgdm mezcla deportes de equipo (fútbol, voley,handball,etc) con
           individuales (ajedrez), así que el formulario se adapta
           según esta elección en vez de tener uno fijo para todos. -->
      <div class="espacio">
        <label for="tipo-participacion">¿Cómo te vas a inscribir?</label>
        <select id="tipo-participacion">
          <option value="">Seleccioná una opción</option>
          <option value="equipo">Como equipo</option>
          <option value="individual">Individualmente</option>
        </select>
      </div>

      <h3 class="subtitulo-form">Datos personales</h3>

      <div class="espacio">
        <label for="nombre-responsable">Nombre completo</label>
        <input type="text" id="nombre-responsable" placeholder="Tu nombre y apellido completo">
      </div>

      <div class="espacio">
        <label for="cedula">Cédula de identidad</label>
        <input type="text" id="cedula" placeholder="Ej: 4123456-7">
      </div>

      <div class="espacio">
        <label for="fecha-nacimiento">Fecha de nacimiento</label>
        <input type="date" id="fecha-nacimiento">
      </div>

      <div class="espacio">
        <label for="genero">Género</label>
        <select id="genero">
          <option value="">Seleccioná una opción</option>
          <option value="masculino">Masculino</option>
          <option value="femenino">Femenino</option>
          <option value="otro">Otro</option>
          <option value="prefiero-no-decir">Prefiero no decirlo</option>
        </select>
      </div>

      <h3 class="subtitulo-form">Contacto</h3>

      <div class="espacio">
        <label for="telefono">Teléfono de contacto</label>
        <input type="tel" id="telefono" placeholder="Ej: 099 123 456">
      </div>

      <div class="espacio">
        <label for="email-contacto">Email de contacto</label>
        <input type="email" id="email-contacto" placeholder="tu@email.com">
      </div>

      <h3 class="subtitulo-form">Información deportiva</h3>

      <!-- La disciplina en este caso ya está fija por el torneo
           al que se inscribe,aca es ajedrez, así que se muestra como
           dato de solo lectura en vez de otro select repetido -->
      <div class="espacio">
        <label>Disciplina</label>
        <p class="dato-fijo">Ajedrez</p>
      </div>

      <div class="espacio">
        <label for="categoria">Categoría / Nivel</label>
        <select id="categoria">
          <option value="">Seleccioná un nivel</option>
          <option value="principiante">Principiante</option>
          <option value="intermedio">Intermedio</option>
          <option value="avanzado">Avanzado</option>
        </select>
      </div>

      <!-- Si es en equipo:
           En el mockup quedan siempre visibles -->
      <div class="espacio">
        <label for="nombre-equipo">Nombre del equipo (si corresponde)</label>
        <input type="text" id="nombre-equipo" placeholder="Ej: Los Tigres FC">
      </div>

      <!-- En vez de un solo número de "cantidad de jugadores" (que
           no capturaba los datos de cada uno), se pide acá la lista
           completa en un textarea. Con la bd esperamos q cada jugador
           tendría su propia ficha individual cargada por separado. -->
      <div class="espacio">
        <label for="lista-plantel">Resto del plantel (nombre y CI de cada jugador, si corresponde)</label>
        <textarea id="lista-plantel" rows="3" placeholder="Ej: Juan Pérez - 4.111.222-3 - Ana López - 4.222.333-4"></textarea>
      </div>
      <button type="submit" class="btn-ingresar">Confirmar inscripción</button>

    </form>

  </div>
</section>
</main>

<footer class="footer">
  <div class="footer-logo">SMNOVA</div>
   <div class="footer-links">
    <a href="contacto.html">Contacto</a>
    <a href="como-funciona.html">Manual</a>
    <span>Instituto Tecnológico Superior Arias-Balparda</span>
  </div>
</footer>
</body>

</html>
