<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="estilos.css">
  <title>SMNOVA — Iniciar sesión</title>
</head>
<body>


  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Logo SMNova" height="60">
        </a>
      </div>
      <div class="nav-derecha">
        <!-- botón hamburguesa: solo visible en celular -->
        <button class="hamburguesa" id="btn-menu" onclick="menuMovil()">☰</button>
        <ul class="menu" id="menu">
          <li><a href="torneos.html">Torneos</a></li>
          <li><a href="como-funciona.html">Manual</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
        <a href="login.html" class="btn-login">Iniciar sesión</a>
      </div>
    </nav>
  </header>


  <main>

    <!-- formulario de inicio de sesión
         En la segunda entrega esperamos q conecta con php
         para verificar el usuario en la bd -->
    <section class="login">
      <div class="tarjetalogin">
        <h2>Iniciar sesión</h2>

        <form>

          <div class="espacio">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tu@email.com">
          </div>

          <div class="espacio">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Tu contraseña">
          </div>

          <button type="submit" class="btn-ingresar">Ingresar</button>

        </form>

        <p class="registro">¿No tenés cuenta? <a href="#">Registrate</a></p>

      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-logo">SMNOVA</div>
    <div class="footer-links">
      <a href="contacto.html">Contacto</a>
      <a href="como-funciona.html">Manual</a>
      <span>Instituto Tecnológico Superior Arias-Balparda</span>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
